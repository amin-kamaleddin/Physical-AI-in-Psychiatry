name: Reproducibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python analysis/validate_models.py
      - name: Verify archived outputs are present
        run: |
          test "$(find figures/main/png -name 'Figure_*.png' | wc -l)" -eq 6
          test "$(find figures/main/svg -name 'Figure_*.svg' | wc -l)" -eq 6
          test -s publication/manuscript.docx
          test -s publication/supplementary_information.docx
          test -s results/global_sensitivity/raw/individual_saltelli_matrix_outputs.csv
  full-reproduction:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python run_all.py
      - run: python -m pytest -q
