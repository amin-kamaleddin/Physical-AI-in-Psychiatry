[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-psychiatry-sandbox"
version = "4.5.0"
description = "Reproducible multiscale simulation stress tests for physical AI in psychiatry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.3,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.10,<4",
  "python-docx>=1.2,<2",
  "scipy>=1.14,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
